<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotorPH IT Support - My Tickets</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-brand">

                <div class="sidebar-logo">

                    <img
                        src="images/motorph-logo.png"
                        alt="MotorPH Logo">

                    <div class="sidebar-title">

                        <h1>MotorPH</h1>

                        <p>IT Support</p>

                        <span class="portal-label">
                            Employee Portal
                        </span>

                    </div>

                </div>

            </div>


            <nav class="sidebar-nav">

                <a href="employee-dashboard.html">
                    Dashboard
                </a>

                <a href="submit-ticket.html">
                    Submit Ticket
                </a>

                <a
                    class="active"
                    href="my-tickets.html">
                    My Tickets
                </a>

                <a href="help.html">
                    Help
                </a>

            </nav>


            <a
                class="logout-button"
                href="index.html">
                Logout
            </a>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="dashboard-content">

            <header class="dashboard-header">

                <div>

                    <h2>My Tickets</h2>

                    <p>
                        Search and monitor your submitted IT support requests.
                    </p>

                </div>

            </header>


            <!-- SEARCH AND FILTER -->
            <section class="dashboard-card filter-card">

                <h3>Search and Filter</h3>

                <form
                    id="ticketFilterForm"
                    class="filter-form">

                    <p>

                        <label for="ticket-search">
                            Search
                        </label>

                        <input
                            type="search"
                            id="ticket-search"
                            name="search"
                            placeholder="Ticket ID or subject">

                    </p>


                    <p>

                        <label for="status-filter">
                            Status
                        </label>

                        <select
                            id="status-filter"
                            name="status">

                            <option value="all">
                                All
                            </option>

                            <option value="open">
                                Open
                            </option>

                            <option value="in-progress">
                                In Progress
                            </option>

                            <option value="resolved">
                                Resolved
                            </option>

                            <option value="closed">
                                Closed
                            </option>

                        </select>

                    </p>


                    <button
                        class="btn btn-primary"
                        type="submit">
                        Filter
                    </button>


                    <button
                        class="btn btn-secondary"
                        id="clearFilters"
                        type="button">
                        Clear
                    </button>

                </form>


                <p
                    id="filterResult"
                    hidden>
                </p>

            </section>


            <!-- SUBMITTED TICKETS -->
            <section class="dashboard-card">

                <h3>Submitted Tickets</h3>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>Ticket ID</th>
                                <th>Subject</th>
                                <th>Category</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Submitted</th>
                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody id="ticketTableBody">

                            <!-- Tickets are loaded from GET /tickets -->

                        </tbody>

                    </table>

                </div>


                <p
                    id="noTicketsMessage"
                    hidden>
                    No tickets matched your search.
                </p>


                <p
                    id="ticketLoadMessage"
                    hidden>
                </p>

            </section>

        </main>

    </div>


    <script src="my-tickets.js"></script>

</body>

</html>
