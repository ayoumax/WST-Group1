<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotorPH IT Support Ticketing System - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-main">

        <!-- LEFT SIDE -->
        <section class="login-visual">

            <img
                src="images/login-illustration.png"
                alt="MotorPH IT Support Illustration">

        </section>


        <!-- LOGIN CARD -->
        <section id="login-area">

            <div class="login-logo">

                <img
                    src="images/motorph-logo.png"
                    alt="MotorPH Logo">

                <div>
                    <h1>MotorPH</h1>
                    <p>IT Support Portal</p>
                </div>

            </div>


            <h2>Sign In</h2>

            <p class="login-description">
                Enter your credentials and select your role.
            </p>


            <form id="loginForm" method="POST" action="/login">

                <!-- USERNAME -->
                <p>

                    <label for="username">
                        <strong>Username:</strong>
                    </label>

                    <br>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required>

                </p>


                <!-- PASSWORD -->
                <p>

                    <label for="password">
                        <strong>Password:</strong>
                    </label>

                    <br>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </p>


                <!-- ROLE -->
                <fieldset>

                    <legend>
                        <strong>Login As</strong>
                    </legend>

                    <p class="login-role-buttons">

                        <button type="submit" data-role="employee">
                            Employee
                        </button>

                        <button type="submit" data-role="technician">
                            IT Technician
                        </button>

                        <button type="submit" data-role="admin">
                            Administrator
                        </button>

                    </p>

                </fieldset>
                        <p id="loginFeedback" role="alert" hidden></p>
            </form>

        </section>

    </main>


    <footer>

        <p>
            MotorPH IT Support Ticketing System &copy; 2026
        </p>

    </footer>
            <script src="login.js"></script>
</body>

</html>
